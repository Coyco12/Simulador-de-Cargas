<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simulador-de-cargas</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <h1> Simulador de Cargas </h1>
        <div class="content">
            <div id="notificacion"></div>
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
            <div class="input-container">
                <div>  
                    <label for="dimension" >Dimensión:</label>
                    <br>
                    <select id="dimension">
                        <option value="general">Selecciona la dimensión</option>
                        <option value="1D">1D</option>
                        <option value="2D">2D</option>
                    </select>
                </div>
                <div>
                    <label for="valorcarga">Valor de la carga:</label>
                    <br>
                    <input type="number" id="valorcarga" placeholder="Valor de la carga" onfocus="button_borrar.classList.remove('borrando')">
                    <select id="prefix">
                        <option value="coulomb">Coulomb</option>
                        <option value="milicoulomb">mC</option>
                        <option value="microcoulomb">μC</option>
                        <option value="nanocoulomb">nC</option>
                    </select>
                </div>
                <div>
                    <button type="button" id="limpiar" onclick="limpiar()">Limpiar espacio</button>
                </div>
                <div>
                    <button type="button" id="borrar">Borrar carga</button>
                </div>  
            </div>
            
        </div>
        <script src="canvas.js"></script> 
    </body>
</html>
